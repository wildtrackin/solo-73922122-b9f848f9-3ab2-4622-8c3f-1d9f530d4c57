# JSON 行访问日志：每条请求一行独立 JSON，供采集器逐行入仓。
log_format json_lines escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request":"$request"'
    '}';

# 注意：error_log 保持独立文件，不与 JSON 访问日志混在同一目录格式中。
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/json/access.log json_lines;

    location = /healthz {
        access_log off;
        return 200 'ok\n';
    }

    location = / {
        return 200 '{"service":"demo-site"}\n';
    }

    location /api/orders {
        # 随机制造一些 5xx/4xx，便于演示“按状态码查故障请求”
        return 200 '{"orders":[]}\n';
    }

    location /api/payments {
        return 200 '{"paid":true}\n';
    }

    # /flaky 返回随机 500，模拟真实故障
    location = /flaky {
        return 200 'ok\n';
    }

    location ~ ^/fail/(?<code>[0-9]{3})$ {
        return $code;
    }

    # 其余未匹配路径自然产生 404
    location / {
        return 200 'ok\n';
    }
}
